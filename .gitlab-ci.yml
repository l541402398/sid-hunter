workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG'
    - when: never

stages:
  - docker-image
  - deploy

variables:
  IMAGE_NAME: "dockeropen.x/hbsun/sid-hunter"
  NO_PROXY: "localhost,127.0.0.1,dockeropen.x,172.26.14.1"
  no_proxy: "localhost,127.0.0.1,dockeropen.x,172.26.14.1"

# 沿用现有项目在任务内启动 dockerd 的方式，Runner 必须启用 privileged。
docker-image:
  stage: docker-image
  image: docker:28-dind
  variables:
    DOCKER_HOST: "unix:///tmp/sid-docker.sock"
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - |
      set -eu
      : "${USER_NAME:?请配置 GitLab CI 变量 USER_NAME}"
      : "${USER_PASSWORD:?请配置 GitLab CI 变量 USER_PASSWORD}"
      printf '%s' "$CI_COMMIT_TAG" | grep -Eq '^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$' || {
        echo 'Git 标签必须是合法 Docker 标签，例如 v1.0.0；不能包含斜杠。'
        exit 1
      }
      dockerd --host="$DOCKER_HOST" --dns=172.26.1.250 --insecure-registry=dockeropen.x >/tmp/dockerd.log 2>&1 &
      attempts=0
      until docker info >/dev/null 2>&1; do
        attempts=$((attempts + 1))
        if [ "$attempts" -ge 30 ]; then
          tail -n 50 /tmp/dockerd.log
          exit 1
        fi
        sleep 1
      done
  script:
    - |
      set -eu
      printf '%s' "$USER_PASSWORD" | docker login --username "$USER_NAME" --password-stdin dockeropen.x
      RELEASE_IMAGE="$IMAGE_NAME:$CI_COMMIT_TAG"
      docker build --pull \
        --build-arg VERSION="$CI_COMMIT_TAG" \
        --build-arg REVISION="$CI_COMMIT_SHA" \
        --build-arg BUILD_DATE="$CI_PIPELINE_CREATED_AT" \
        --tag "$RELEASE_IMAGE" .
      docker run --rm --network none "$RELEASE_IMAGE" node healthcheck-test.mjs
      docker push "$RELEASE_IMAGE"

deploy:
  stage: deploy
  image: node:22-alpine
  resource_group: sid-production
  environment:
    name: production
  script:
    - node --test ci/deploy-test.mjs
    - node ci/deploy.mjs
